name: Clarabridge
description: >-
  Clarabridge was a customer experience management (CEM) and conversational
  analytics company known for its natural-language-understanding platform that
  analyzed unstructured customer feedback — contact-center transcripts, chat,
  email, surveys, social media, and online reviews — to surface sentiment,
  emotion, effort, intent, and emerging topics. Qualtrics acquired Clarabridge
  in 2021, and the technology has since been integrated and rebranded inside the
  Qualtrics XM platform: Clarabridge Studio became Qualtrics XM Discover and
  Clarabridge Engage became Qualtrics Connect. Clarabridge no longer operates an
  independent developer portal or public API; its capabilities are now delivered
  through Qualtrics. This profile is retained as a company/brand record in the
  API Evangelist network with an acquisition pointer to Qualtrics.
